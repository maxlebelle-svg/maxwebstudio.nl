<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Webshop portaal | Max Webstudio</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=8.0.4" />
  </head>
  <body class="webshop-login-page">
    <main class="webshop-login-shell">
      <section class="webshop-login-card" aria-labelledby="webshop-login-title">
        <a class="brand" href="/" aria-label="Terug naar Max Webstudio">
          <svg class="brand-mark" viewBox="0 0 80 80" role="img" aria-label="Max Webstudio logo">
            <rect x="6" y="6" width="68" height="68" rx="18"></rect>
            <path class="brand-m" d="M22 53V27h7.3L40 42.2 50.7 27H58v26h-8.1V39.1l-7.5 10.2h-4.8l-7.5-10.2V53H22Z"></path>
            <path class="brand-spark" d="M58 25h9v9" fill="none" stroke-width="4" stroke-linecap="round"></path>
          </svg>
          <span>Max Webstudio</span>
        </a>
        <span class="webshop-login-kicker">Webshop portaal</span>
        <h1 id="webshop-login-title">De webshoplogin wordt voorbereid.</h1>
        <p>
          Binnenkort kun je hier veilig inloggen om je webshop, bestellingen en producten te beheren.
        </p>
        <div class="webshop-login-status">
          <span aria-hidden="true"></span>
          Binnenkort beschikbaar
        </div>
        <a class="button primary" href="/">Terug naar Max Webstudio</a>
      </section>
    </main>
  </body>
</html>
