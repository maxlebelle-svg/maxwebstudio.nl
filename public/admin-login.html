<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin login | Max Webstudio</title>
    <meta name="description" content="Beveiligde medewerkerslogin voor Max Webstudio Admin." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260803-admin-login-studio" />
    <link rel="stylesheet" href="admin-login.css?v=20260803-admin-login-studio" />
  </head>
  <body class="admin-body admin-login-page">
    <main class="admin-login-shell">
      <section class="admin-login-card" aria-labelledby="admin-login-heading">
        <div class="admin-login-brand" aria-label="Max Webstudio Admin">
          <svg class="admin-login-mark" viewBox="0 0 80 80" aria-hidden="true">
            <rect x="6" y="6" width="68" height="68" rx="18"></rect>
            <path class="admin-login-mark-m" d="M22 53V27h7.3L40 42.2 50.7 27H58v26h-8.1V39.1l-7.5 10.2h-4.8l-7.5-10.2V53H22Z"></path>
            <path class="admin-login-mark-spark" d="M58 25h9v9"></path>
          </svg>
          <p>Max Webstudio <span>Admin</span></p>
        </div>

        <div class="admin-login-intro" id="admin-login-view">
          <h1 id="admin-login-heading">Welkom terug.</h1>
          <p>Log in met je Max Webstudio medewerkersaccount.</p>
        </div>

        <form class="admin-login-form" id="admin-login-form" novalidate>
          <label for="admin-email">
            <span>E-mailadres</span>
            <span class="admin-login-field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h18v13H3z"></path><path d="m4 7 8 6 8-6"></path></svg>
              <input id="admin-email" name="email" type="email" autocomplete="email" placeholder="jouw@email.nl" required />
            </span>
          </label>
          <label for="admin-password">
            <span>Wachtwoord</span>
            <span class="admin-login-field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
              <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
              <button class="admin-password-toggle" id="admin-password-toggle" type="button" aria-label="Wachtwoord tonen" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.1 12s3.6-6.5 9.9-6.5 9.9 6.5 9.9 6.5-3.6 6.5-9.9 6.5S2.1 12 2.1 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </span>
          </label>
          <button class="admin-login-submit" id="admin-login-submit" type="submit">Inloggen</button>
          <button class="admin-login-secondary" id="admin-forgot-password" type="button">Wachtwoord vergeten</button>
        </form>

        <section class="admin-reset-panel" id="admin-reset-panel" aria-labelledby="admin-reset-heading" hidden>
          <div>
            <h2 id="admin-reset-heading">Wachtwoord herstellen.</h2>
            <p>Vul je medewerkersadres in. Als het account bekend is, ontvang je een resetlink.</p>
          </div>
          <form class="admin-login-form" id="admin-reset-form">
            <label for="admin-reset-email">
              <span>E-mailadres</span>
              <span class="admin-login-field">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h18v13H3z"></path><path d="m4 7 8 6 8-6"></path></svg>
                <input id="admin-reset-email" name="email" type="email" autocomplete="email" placeholder="jouw@email.nl" required />
              </span>
            </label>
            <button class="admin-login-submit" id="admin-reset-submit" type="submit">Resetlink aanvragen</button>
            <button class="admin-login-secondary" id="admin-reset-back" type="button">Terug naar inloggen</button>
          </form>
        </section>

        <p class="admin-login-status" id="admin-login-status" role="status" aria-live="polite">We controleren veilig of je al bent ingelogd.</p>
      </section>
    </main>

    <script type="module">
      const ADMIN_SESSION_KEY = "mws_admin_supabase_session";
      const SUPABASE_SESSION_KEY = "maxwebstudioSupabaseAuthSession";
      const adminRoles = new Set(["developer", "super_admin", "admin", "sales_manager", "sales_partner", "designer", "support"]);
      const roleAliases = { sales: "sales_partner" };
      const loginForm = document.getElementById("admin-login-form");
      const resetForm = document.getElementById("admin-reset-form");
      const loginIntro = document.getElementById("admin-login-view");
      const resetPanel = document.getElementById("admin-reset-panel");
      const status = document.getElementById("admin-login-status");
      const loginSubmit = document.getElementById("admin-login-submit");
      const resetSubmit = document.getElementById("admin-reset-submit");
      let navigating = false;

      function safeRelativePath(value = "", fallback = "/admin-dashboard.html") {
        try {
          const parsed = new URL(value || fallback, window.location.origin);
          if (parsed.origin !== window.location.origin) return fallback;
          const allowedPath = /^\/admin(?:-|\/|$)/.test(parsed.pathname) || parsed.pathname === "/partner-onboarding.html";
          if (!allowedPath || parsed.pathname === "/admin-login.html") return fallback;
          return `${parsed.pathname}${parsed.search}${parsed.hash}`;
        } catch {
          return fallback;
        }
      }

      function requestedNext() {
        const params = new URLSearchParams(window.location.search || "");
        return safeRelativePath(params.get("next") || params.get("redirect") || "/admin-dashboard.html");
      }

      function hasRequestedNext() {
        const params = new URLSearchParams(window.location.search || "");
        return Boolean(params.get("next") || params.get("redirect"));
      }

      function normalizeRole(value = "") {
        const rawRole = String(value || "").trim().toLowerCase().replace(/[\s-]+/g, "_");
        return roleAliases[rawRole] || rawRole;
      }

      function defaultTargetForRole(role = "") {
        return ["sales_partner", "sales_manager"].includes(normalizeRole(role)) ? "/admin-sales.html" : "/admin-dashboard.html";
      }

      function readJson(key) {
        try {
          return JSON.parse(localStorage.getItem(key) || "null");
        } catch {
          return null;
        }
      }

      function storedAccessToken() {
        const supabase = readJson(SUPABASE_SESSION_KEY);
        if (supabase?.access_token) return { token: supabase.access_token, expiresAt: Number(supabase.expires_at || 0) * 1000 };
        const admin = readJson(ADMIN_SESSION_KEY);
        if (admin?.accessToken) return { token: admin.accessToken, expiresAt: Number(admin.expiresAt || 0) };
        return null;
      }

      function setStatus(message, type = "") {
        status.textContent = message;
        status.dataset.state = type;
      }

      function setBusy(button, busy, busyLabel, defaultLabel) {
        button.disabled = busy;
        button.textContent = busy ? busyLabel : defaultLabel;
      }

      function navigateOnce(target) {
        if (navigating) return;
        navigating = true;
        window.location.replace(safeRelativePath(target));
      }

      async function fetchAccountProfile(accessToken) {
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), 12000);
        try {
          const response = await fetch("/api/account-profile", {
            headers: { Accept: "application/json", Authorization: `Bearer ${accessToken}` },
            cache: "no-store",
            signal: controller.signal,
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.success) {
            const error = new Error(data.error || "Je medewerkersprofiel kon niet worden gecontroleerd.");
            error.code = data.code || "PROFILE_LOOKUP_FAILED";
            error.status = response.status;
            throw error;
          }
          return data;
        } finally {
          window.clearTimeout(timer);
        }
      }

      function safeLoginMessage(error = {}) {
        const code = String(error.code || error.supabaseAuth?.code || "").toUpperCase();
        const message = String(error.message || "").toLowerCase();
        if (code.includes("INVALID") || message.includes("credentials")) return "E-mailadres of wachtwoord is onjuist.";
        if (code.includes("EMAIL_NOT_CONFIRMED")) return "Bevestig eerst je e-mailadres voordat je inlogt.";
        if (code === "PROFILE_INACTIVE") return "Dit medewerkersaccount is niet actief.";
        if (["ROLE_NOT_ALLOWED", "PROFILE_ROLE_DENIED", "PROFILE_ROLE_MISSING"].includes(code)) return "Dit account heeft geen toegang tot Max Webstudio Admin.";
        if (code === "PARTNER_ONBOARDING_REQUIRED") return "Rond eerst je onboarding af om de adminomgeving te openen.";
        if (code.includes("NETWORK") || code.includes("FETCH") || error.name === "AbortError") return "De loginomgeving is nu niet bereikbaar. Probeer het zo opnieuw.";
        return "Inloggen is niet gelukt. Controleer je gegevens en probeer het opnieuw.";
      }

      async function grantAdminAccess(session, account) {
        const role = normalizeRole(account.profile?.role);
        const profileStatus = String(account.profile?.status || "").toLowerCase();
        const operational = account.access?.operational !== false;
        const onboardingRequired = role === "sales_partner" && account.access?.onboardingRequired;
        if (onboardingRequired) {
          setStatus("Login gelukt. Je onboarding wordt geopend.", "success");
          navigateOnce("/partner-onboarding.html");
          return;
        }
        if (profileStatus !== "active") {
          const error = new Error("Profile inactive");
          error.code = "PROFILE_INACTIVE";
          throw error;
        }
        if (!adminRoles.has(role)) {
          const error = new Error("Role denied");
          error.code = "ROLE_NOT_ALLOWED";
          throw error;
        }
        if (!operational) {
          const error = new Error("Onboarding required");
          error.code = "PARTNER_ONBOARDING_REQUIRED";
          throw error;
        }
        const bridge = await import("./src/services/adminAuthBridgeService.js?v=20260803-admin-login");
        await bridge.resolveAdminAuth({ account });
        const target = hasRequestedNext() ? requestedNext() : defaultTargetForRole(role);
        setStatus("Toegang bevestigd. Je adminomgeving wordt geopend.", "success");
        navigateOnce(target);
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!loginForm.reportValidity()) return;
        const data = Object.fromEntries(new FormData(loginForm).entries());
        setBusy(loginSubmit, true, "Inloggen…", "Inloggen");
        setStatus("Je medewerkersaccount wordt veilig gecontroleerd.");
        try {
          const auth = await import("./src/services/authService.js?v=20260803-admin-login");
          const result = await auth.signInWithEmail(data.email, data.password);
          const session = result.session || readJson(SUPABASE_SESSION_KEY);
          if (!session?.access_token) {
            const error = new Error("Login session incomplete");
            error.code = "AUTH_SESSION_INCOMPLETE";
            throw error;
          }
          const account = await fetchAccountProfile(session.access_token);
          await grantAdminAccess(session, account);
        } catch (error) {
          setStatus(safeLoginMessage(error), "error");
          setBusy(loginSubmit, false, "Inloggen…", "Inloggen");
        }
      });

      resetForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!resetForm.reportValidity()) return;
        const data = Object.fromEntries(new FormData(resetForm).entries());
        setBusy(resetSubmit, true, "Versturen…", "Resetlink aanvragen");
        setStatus("De resetaanvraag wordt verstuurd.");
        try {
          const response = await fetch("/.netlify/functions/client-password-reset", {
            method: "POST",
            headers: { Accept: "application/json", "Content-Type": "application/json" },
            body: JSON.stringify({ email: data.email }),
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || result.success === false) throw new Error(result.error || "Reset failed");
          resetForm.reset();
          setStatus("Als dit e-mailadres bekend is, wordt er een resetlink verstuurd.", "success");
        } catch {
          setStatus("Resetlink aanvragen is niet gelukt. Probeer het later opnieuw.", "error");
        } finally {
          setBusy(resetSubmit, false, "Versturen…", "Resetlink aanvragen");
        }
      });

      document.getElementById("admin-password-toggle").addEventListener("click", (event) => {
        const input = document.getElementById("admin-password");
        const visible = input.type === "password";
        input.type = visible ? "text" : "password";
        event.currentTarget.setAttribute("aria-pressed", String(visible));
        event.currentTarget.setAttribute("aria-label", visible ? "Wachtwoord verbergen" : "Wachtwoord tonen");
        input.focus();
      });

      document.getElementById("admin-forgot-password").addEventListener("click", () => {
        loginIntro.hidden = true;
        loginForm.hidden = true;
        resetPanel.hidden = false;
        document.getElementById("admin-reset-email").value = document.getElementById("admin-email").value;
        setStatus("Vraag een resetlink aan voor je medewerkersaccount.");
        document.getElementById("admin-reset-email").focus();
      });

      document.getElementById("admin-reset-back").addEventListener("click", () => {
        resetPanel.hidden = true;
        loginIntro.hidden = false;
        loginForm.hidden = false;
        setStatus("Log in met je Max Webstudio medewerkersaccount.");
        document.getElementById("admin-email").focus();
      });

      async function init() {
        const stored = storedAccessToken();
        if (!stored?.token || (stored.expiresAt && stored.expiresAt <= Date.now() + 30000)) {
          localStorage.removeItem(ADMIN_SESSION_KEY);
          setStatus("Log in met je Max Webstudio medewerkersaccount.");
          return;
        }
        try {
          const account = await fetchAccountProfile(stored.token);
          await grantAdminAccess({ access_token: stored.token }, account);
        } catch (error) {
          localStorage.removeItem(ADMIN_SESSION_KEY);
          setStatus(safeLoginMessage(error), "error");
        }
      }

      init();
    </script>
  </body>
</html>
