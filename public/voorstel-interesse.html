<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Interesse bevestigen | Max Webstudio</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:#061827;color:#f6f9fc;font-family:Inter,system-ui,sans-serif}.card{width:min(620px,100%);padding:34px;box-sizing:border-box;border:1px solid #24445e;border-radius:22px;background:#0a2235;box-shadow:0 24px 70px rgba(0,0,0,.3)}h1{font-size:clamp(2rem,7vw,3.3rem);margin:.2em 0}p{color:#b5c8d6;line-height:1.65}.notice{padding:15px;border-radius:12px;background:#123a2b;color:#bdf8dc}button{width:100%;padding:15px;border:0;border-radius:11px;background:#18a979;color:#fff;font:inherit;font-weight:850;cursor:pointer}button:disabled{opacity:.55}</style>
  </head>
  <body><main class="card"><img src="max-webstudio-logo-full.svg" width="210" alt="Max Webstudio"><h1>Verder praten over je demo?</h1><p>Bevestig hieronder dat je graag verder wilt praten over dit voorstel.</p><p class="notice">Dit is nog geen digitale ondertekening, contract, factuur of betalingsopdracht.</p><button id="confirm" type="button">Ja, ik wil verder met deze demo</button><p id="status" role="status" aria-live="polite"></p></main><script>
    const button=document.getElementById('confirm');const status=document.getElementById('status');
    const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'',location.pathname);
    if(!token){button.disabled=true;status.textContent='Deze interesselink is ongeldig of niet meer beschikbaar.'}
    button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Bevestiging veilig verwerken…';try{const response=await fetch('/api/commercial-offer-interest',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store'});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||'Bevestiging mislukt.');status.textContent=data.message;button.hidden=true}catch(error){status.textContent=error.message;button.disabled=false}});
  </script></body>
</html>
