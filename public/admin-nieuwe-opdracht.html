<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Doorsturen naar Voorstellen | Max Webstudio</title>
    <script>
      (() => {
        const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
        const source = new URLSearchParams(location.search);
        const target = new URL('/admin-offer-composer.html', location.origin);
        const type = source.get('relationshipType') || (source.get('leadId') ? 'lead' : source.get('customerId') ? 'customer' : '');
        const relationshipId = source.get('relationshipId') || source.get(type === 'lead' ? 'leadId' : 'customerId') || '';
        if (['lead', 'customer'].includes(type) && UUID.test(relationshipId)) {
          target.searchParams.set('relationshipType', type);
          target.searchParams.set('relationshipId', relationshipId);
        }
        for (const key of ['demoJourneyId', 'factoryProjectId', 'offerId']) {
          const value = source.get(key) || '';
          if (UUID.test(value)) target.searchParams.set(key, value);
        }
        const routeSource = String(source.get('source') || 'legacy-new-assignment').trim().slice(0, 80);
        if (/^[a-zA-Z0-9_-]+$/.test(routeSource)) target.searchParams.set('source', routeSource);
        location.replace(target.pathname + target.search);
      })();
    </script>
  </head>
  <body data-admin-sidebar-exception="standalone">
    <p>U wordt veilig doorgestuurd naar <a href="/admin-offer-composer.html">Voorstellen</a>.</p>
  </body>
</html>
