[build]
  publish = "public"

[functions]
  directory = "functions"

[functions."website-factory"]
  included_files = [
    "content-factory/content-factory-adapter/v1/index.mjs",
    "content-factory/content-factory-adapter/v2/index.mjs",
    "content-factory/public/v1/index.mjs",
    "content-factory/public/v2/index.mjs",
    "content-factory/src/asset-pack-resolver.mjs",
    "content-factory/src/composition.mjs",
    "content-factory/src/content-blocks.mjs",
    "content-factory/src/goals.mjs",
    "content-factory/src/personalities.mjs",
    "content-factory/src/quality.mjs",
    "content-factory/src/specializations.mjs",
    "content-factory/src/styles.mjs",
    "content-factory/src/verticals.mjs",
    "content-factory/generated/catalog.json",
    "content-factory/generated/branches/**",
    "content-factory/assets/packs/registry.json",
    "content-factory/assets/packs/priority-assets-2026.1/pack-manifest.json"
  ]

[functions."demo-journey"]
  included_files = ["public/assets/demo-images/library/bouwbedrijf/**"]

[[redirects]]
  from = "/account-activeren"
  to = "/account-activeren.html"
  status = 200

[[redirects]]
  from = "/admin-login"
  to = "/admin-login.html"
  status = 200

[[redirects]]
  from = "/klant-login"
  to = "/klant-login.html"
  status = 200

[[redirects]]
  from = "/admin-assets"
  to = "/admin-assets.html"
  status = 200

[[redirects]]
  from = "/admin-social-media-studio"
  to = "/admin-social-media-studio.html"
  status = 200

[[redirects]]
  from = "/admin-max-brain"
  to = "/admin-max-brain.html"
  status = 200

[[redirects]]
  from = "/admin-platform-health"
  to = "/admin-platform-health.html"
  status = 200

[[redirects]]
  from = "/admin-nieuwe-opdracht"
  to = "/admin-nieuwe-opdracht.html"
  status = 200

[[redirects]]
  from = "/api/customer-timeline/:customerId"
  to = "/.netlify/functions/customer-timeline/:customerId"
  status = 200

[[redirects]]
  from = "/api/global-search"
  to = "/.netlify/functions/global-search"
  status = 200

[[redirects]]
  from = "/api/max-brain/context"
  to = "/.netlify/functions/max-brain-context"
  status = 200

[[redirects]]
  from = "/api/platform-health"
  to = "/.netlify/functions/platform-health"
  status = 200

[[redirects]]
  from = "/api/customer-onboarding"
  to = "/.netlify/functions/customer-onboarding"
  status = 200

[[redirects]]
  from = "/api/:splat"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), bluetooth=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://maps.googleapis.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co https://api.mollie.com https://api.resend.com https://maps.googleapis.com; frame-src 'self' https://www.google.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/preview.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), clipboard-read=(), clipboard-write=(), payment=(), usb=(), bluetooth=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/preview-embed.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Cache-Control = "no-store, max-age=0, must-revalidate"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), clipboard-read=(), clipboard-write=(), payment=(), usb=(), bluetooth=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/content-factory/packs/priority-assets-2026.1/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin-*.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/admin-dashboard.html"
  [headers.values]
